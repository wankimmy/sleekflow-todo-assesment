name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sleekflow
          POSTGRES_PASSWORD: sleekflow
          POSTGRES_DB: sleekflow_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleekflow -d sleekflow_todo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
      TEST_DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:query-budgets
      - run: npm run build
