name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  NODE_VERSION: "22"

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    env:
      # prisma generate reads prisma.config.ts which requires DATABASE_URL
      DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit

  feature:
    name: feature
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sleekflow
          POSTGRES_PASSWORD: sleekflow
          POSTGRES_DB: sleekflow_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleekflow -d sleekflow_todo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
      TEST_DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3010
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: End-to-end feature tests
        run: npm run test:e2e

  performance:
    name: performance
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sleekflow
          POSTGRES_PASSWORD: sleekflow
          POSTGRES_DB: sleekflow_todo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sleekflow -d sleekflow_todo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
      TEST_DATABASE_URL: postgresql://sleekflow:sleekflow@localhost:5432/sleekflow_todo_test?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run verify:query-budgets
      - run: npm run verify:scale

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: npm audit (high+)
        run: npm run security:audit
      - name: OWASP SCA (Trivy NVD/GHSA)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          format: table
          scanners: vuln
      - name: OWASP Dependency-Check (docker image with baked NVD)
        run: |
          set -euo pipefail
          mkdir -p reports
          docker run --rm \
            -v "$PWD":/src \
            owasp/dependency-check:latest \
            --project sleekflow-todo \
            --scan /src/package.json \
            --scan /src/package-lock.json \
            --format HTML \
            --format JSON \
            --out /src/reports \
            --suppression /src/dependency-check-suppressions.xml \
            --failOnCVSS 7 \
            --noupdate \
            --prettyPrint
      - name: Upload OWASP Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check
          path: reports
          if-no-files-found: ignore
